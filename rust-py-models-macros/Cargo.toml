[package]
name = "rust-py-models-macros"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Derive macro for rust-py-models"
homepage = "https://github.com/miinhho/rust-py-models"
repository = "https://github.com/miinhho/rust-py-models"

[features]
default = []
serde-compat = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["fold", "full"] }
heck = "0.5"
