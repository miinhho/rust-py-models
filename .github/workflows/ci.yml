name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust without optional features
        run: cargo test --workspace --locked
      - name: Test Rust with all features
        run: cargo test --workspace --all-features --locked

      - name: Generate Python bindings
        run: cargo run --package rust-py-models-test-generator --locked -- python-tests/binding

      - name: Save generated Python bindings
        uses: actions/upload-artifact@v7
        with:
          name: python-bindings
          path: python-tests/binding/
          if-no-files-found: error

  python:
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: python-tests/uv.lock
      - name: Restore generated Python bindings
        uses: actions/download-artifact@v7
        with:
          name: python-bindings
          path: python-tests/binding/

      - name: Sync locked Python test environment
        run: uv sync --project python-tests --locked --python '${{ matrix.python-version }}'
      - name: Test generated Python
        run: uv run --project python-tests --locked --python '${{ matrix.python-version }}' python python-tests --check-only
