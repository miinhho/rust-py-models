name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust without optional features
        run: cargo test --workspace --locked
      - name: Test Rust and generate Python bindings
        run: cargo test --workspace --all-features --locked

      - name: Save generated Python bindings
        uses: actions/upload-artifact@v7
        with:
          name: python-bindings
          path: py-rs/bindings/
          if-no-files-found: error

  python:
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore generated Python bindings
        uses: actions/download-artifact@v7
        with:
          name: python-bindings
          path: py-rs/bindings/

      - name: Install Python test tools
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test generated Python
        run: python scripts/test_python.py --bindings-dir py-rs/bindings
